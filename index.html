<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Verification - Test</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background: #26a69a; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .status-box { background: #e0f2f1; color: #00796b; padding: 20px; text-align: center; border-bottom: 2px solid #b2dfdb; }
        .status-box h2 { margin: 10px 0 0 0; color: #004d40; }
        .checkmark { font-size: 40px; color: #4caf50; }
        .error-box { background: #ffebee; color: #c62828; padding: 30px; text-align: center; }
        .details { padding: 20px; }
        .field { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; text-align: center; }
        .field label { display: block; font-size: 12px; color: #757575; text-transform: uppercase; margin-bottom: 3px; }
        .field span { font-size: 16px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container" id="main-container"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const secretToken = urlParams.get('token');
    const container = document.getElementById('main-container');

    const MY_SECRET_KEY = "test_invoice_2026"; 

    if (secretToken !== MY_SECRET_KEY) {
        container.innerHTML = `
            <div class="header" style="background: #d32f2f;">Access Restricted</div>
            <div class="error-box">
                <h2>Μη εξουσιοδοτημένη πρόσβαση</h2>
                <p>Αυτή η σελίδα προορίζεται αποκλειστικά για δοκιμές μέσω QR code.</p>
            </div>
        `;
    } else {
        container.innerHTML = `
            <div class="header">Invoice Verification</div>
            <div class="status-box">
                <div class="checkmark">✔</div>
                <h2>Invoice is verified</h2>
                <p style="font-size: 13px; color: #555;">Test Environment Active</p>
            </div>
            <div class="details">
                <div class="field">
                    <label>Buyer's / Seller's TIN</label>
                    <span>${urlParams.get('tin') || '101670560'}</span>
                </div>
                <div class="field">
                    <label>Location Name</label>
                    <span>${urlParams.get('store') || 'RODA MEGAMARKET'}</span>
                </div>
                <div class="field">
                    <label>Total Amount</label>
                    <span>${urlParams.get('amount') || '339.97'} €</span>
                </div>
                <div class="field">
                    <label>SDC Time</label>
                    <span>${urlParams.get('date') || '22/10/2026 12:33:25 PM'}</span>
                </div>
            </div>
        `;
    }
</script>

</body>
</html>
