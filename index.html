<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Резултат провере рачуна - SUF RS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #eef2f5; margin: 0; padding: 10px; color: #2c3e50; }
        .receipt-card { max-width: 460px; margin: 10px auto; background: #ffffff; border-radius: 8px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #dcdde1; }
        .gov-header { background: #004080; color: white; padding: 12px; text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .success-banner { background: #f0f7f4; padding: 20px 15px; text-align: center; border-bottom: 2px solid #d4ede1; }
        .success-banner img { width: 64px; height: 64px; margin-bottom: 8px; }
        .success-banner h2 { margin: 0; font-size: 18px; color: #2e7d32; font-weight: 600; }
        .error-box { background: #ffebee; color: #c62828; padding: 30px; text-align: center; }
        .details-section { padding: 15px 20px; }
        .row-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f2f6; font-size: 13.5px; align-items: center; }
        .row-item:last-child { border-bottom: none; }
        .row-label { color: #718093; font-weight: 500; width: 45%; text-align: left; }
        .row-value { color: #2d3436; font-weight: 600; width: 55%; text-align: right; word-break: break-word; }
        .total-row { background: #f8f9fa; margin: 10px -20px -15px -20px; padding: 15px 20px; border-top: 2px dashed #dcdde1; display: flex; justify-content: space-between; align-items: center; }
        .total-label { font-size: 15px; font-weight: 750; color: #2d3436; }
        .total-value { font-size: 18px; font-weight: 800; color: #004080; text-align: right; }
        .sub-eur { font-size: 11.5px; color: #636e72; font-weight: normal; margin-top: 2px; text-align: right; }
        .footer-note { text-align: center; font-size: 11px; color: #b2bec3; padding: 12px; background: #fdfdfd; border-top: 1px solid #f1f2f6; }
    </style>
</head>
<body>

<div class="receipt-card" id="main-container"></div>

<script>
    const p = new URLSearchParams(window.location.search);
    const secretToken = p.get('token');
    const container = document.getElementById('main-container');

    const MY_SECRET_KEY = "test_invoice_2026"; 

    if (secretToken !== MY_SECRET_KEY) {
        container.innerHTML = `
            <div class="gov-header" style="background: #c0392b;">Приступ одбијен (Access Restricted)</div>
            <div class="error-box">
                <h3 style="margin-top:0;">Неовлашћени приступ</h3>
                <p>Ова страница је намењена искључиво за симулацију и проверу фискалних рачуна.</p>
            </div>
        `;
    } else {
        container.innerHTML = `
            <div class="gov-header">Република Србија — Пореска управа<br><span style="font-size:12px; font-weight:normal;">Систем електронских фактура / ЕФР</span></div>
            
            <div class="success-banner">
                <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjggMTI4Ij48Y2lyY2xlIGN4PSI2NCIgY3k9IjY0IiByPSI2MiIgZmlsbD0iIzgxYzc4NCIvPjxjaXJjbGUgY3k9IjY0IiBjeD0iNjQiIHI9IjU0IiBmaWxsPSJub25lIiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjQiLz48cGF0aCBkPSJNMzYgNjdsMTggMTggMzQtMzQiIGZpbGw9Im5vbmUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iOCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PC9zdmc+" alt="Success">
                <h2>Рачун је валидан и проверен</h2>
                <p style="font-size: 11.5px; color: #4e7354; margin: 4px 0 0 0;">Овај рачун је успешно регистрован у систему ПУРС</p>
            </div>

            <div class="details-section">
                <div class="row-item">
                    <span class="row-label">Предузеће (Company):</span>
                    <span class="row-value">${p.get('cmp') || '-'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">ПИБ (TIN):</span>
                    <span class="row-value">${p.get('tin') || '-'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">Продајно место (Location):</span>
                    <span class="row-value">${p.get('loc') || '-'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">Адреса (Address):</span>
                    <span class="row-value">${p.get('adr') || '-'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">Касир (Cashier):</span>
                    <span class="row-value">${p.get('csh') || '-'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">ЕСИР број (ESIR ID):</span>
                    <span class="row-value">${p.get('esir') || '-'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">Врста рачуна (Type):</span>
                    <span class="row-value">${p.get('typ') || 'Промет'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">Тип трансакциије:</span>
                    <span class="row-value">${p.get('trn') || 'Продаја'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">Начин плаћања (Pay):</span>
                    <span class="row-value">${p.get('pay') || 'Готовина'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">ПДВ износ (VAT 20%):</span>
                    <span class="row-value">${p.get('vat') || '0,00'} RSD</span>
                </div>
                <div class="row-item">
                    <span class="row-label">ПФР време (SDC Time):</span>
                    <span class="row-value">${p.get('dt') || '-'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">ПФР број рачуна:</span>
                    <span class="row-value" style="font-size:12px;">${p.get('inv') || '-'}</span>
                </div>
                <div class="row-item">
                    <span class="row-label">Бројач рачуна (Counter):</span>
                    <span class="row-value">${p.get('cnt') || '-'}</span>
                </div>

                <div class="total-row">
                    <div>
                        <div class="total-label">Укупан износ (Total):</div>
                        <div class="sub-eur">${p.get('eur') ? 'еквивалент: ' + p.get('eur') + ' €' : ''}</div>
                    </div>
                    <div class="total-value">
                        ${p.get('amt') || '0,00'} RSD
                    </div>
                </div>
            </div>

            <div class="footer-note">
                Пореска управа Републике Србије • Симулационо окружење за тестирање
            </div>
        `;
    }
</script>

</body>
</html>
